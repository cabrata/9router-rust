[package]
name = "nr-cli"
description = "The `9router` command: starts the server and manages it (port of cli/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "9router"
path = "src/main.rs"

[dependencies]
nr-core.workspace = true
nr-server.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
inquire = "0.7"
open = "5"
libc = "0.2"  # for signal handling and process management
regex.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winsock2", "winnt", "psapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
