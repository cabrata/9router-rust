[package]
name = "nr-cli"
description = "The `9router` command: starts the server and manages it (port of cli/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "9router"
path = "src/main.rs"

[features]
default = []
# Opt-in tray icon. Needs GTK dev libs on Linux, so it is never a default dep:
# `cargo build -p nr-cli --features tray`.
tray = ["tray-icon", "gtk"]

[dependencies]
nr-core.workspace = true
nr-server.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
inquire = "0.7"
open = "5"
libc = "0.2"  # for signal handling and process management
regex.workspace = true
chrono.workspace = true
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
toml_edit = "0.22"
serde_yaml = "0.9"
# Optional, only pulled in with `--features tray`.
tray-icon = { version = "0.19", optional = true }
gtk = { version = "0.18", optional = true }
dirs = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winsock2", "winnt", "psapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
toml_edit = "0.22"
serde_yaml = "0.9"
